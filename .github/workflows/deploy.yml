name: Uniconnect CD - Despliegue en Fly.io

on:
  push:
    branches: [ "main", "feature/auth-service-unit-tests" ]

jobs:
  test:
    name: 1. Instalar dependencias y correr pruebas
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/auth-service
          - services/social-service

    steps:
    - name: 1.1. Clonar el repositorio
      uses: actions/checkout@v4

    - name: 1.2. Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 1.3. Instalar dependencias para el servicio
      run: |
        cd ${{ matrix.service }}
        npm ci

    - name: 1.4. Instalar Java (requerido para el emulador de Firebase)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: 1.5. Iniciar emulador de Firestore
      run: |
        npm install -g firebase-tools
        firebase emulators:start --only firestore --project test-project &
        sleep 10
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    - name: 1.6. Ejecutar pruebas unitarias e integración con la variable de test
      env:
        NODE_ENV: test
        FIRESTORE_EMULATOR_HOST: localhost:8080
      run: |
        cd ${{ matrix.service }}
        npx jest --forceExit --detectOpenHandles

  deploy:
    name: 2. Construir y Desplegar en Fly.io
    needs: test # Este job solo se ejecutará si el job 'test' pasa exitosamente
    runs-on: ubuntu-latest

    steps:
    - name: 2.1. Clonar el repositorio
      uses: actions/checkout@v4

    - name: 2.2. Instalar Flyctl
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: 2.3. Build y Deploy a Fly.io
      run: |
        # Reemplaza 'tu-nombre-de-app-en-fly' por el nombre real de tu aplicación en Fly.io
        flyctl deploy --remote-only --app tu-nombre-de-app-en-fly
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}